version: '3.8'
services:
  db:
    image: postgres:15
    container_name: shopping_db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: shopping_backend
    environment:
      DB_HOST: db
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: 123456
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: nginx:alpine
    container_name: shopping_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: